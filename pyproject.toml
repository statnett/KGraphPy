[project]
name = "KGraphPy"
version = "0.2.3"
description = "Plugin for rdflib for handling parsing and serialization of cim graphs."
requires-python = ">=3.12"
dependencies = [
    "build>=1.5.0",
    "linkml>=1.9.6",
    "rdflib[graphdb]>=7.5.0",
]

[tool.setuptools]
packages = ["kgraphpy"]

[tool.setuptools.package-data]
kgraphpy = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
markers = [
    "stress: long-running stress tests"
]
addopts = "-m 'not stress' -rP"
