[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "KGraphPy"
version = "0.2.3"
description = "Plugin for rdflib for handling parsing and serialization of cim graphs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Statnett" }]
requires-python = ">=3.12"
keywords = ["rdf", "rdflib", "cim", "cgmes", "knowledge-graph", "linkml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "linkml>=1.9.6",
    "rdflib[graphdb]>=7.5.0",
]

[project.urls]
Repository = "https://github.com/statnett/KGraphPy"
Issues = "https://github.com/statnett/KGraphPy/issues"
Changelog = "https://github.com/statnett/KGraphPy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6",
]

[tool.setuptools]
packages = ["kgraphpy"]

[tool.setuptools.package-data]
kgraphpy = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
markers = [
    "stress: long-running stress tests"
]
addopts = "-m 'not stress' -rP"
